name: ci

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang-format ninja-build
      - name: Configure
        run: cmake --preset cpu-debug
      - name: Build
        run: cmake --build --preset cpu-debug
      - name: Test C++
        run: ctest --preset cpu-debug
      - name: Test Rust
        run: cargo test --workspace
      - name: Check formatting
        run: |
          find cpp crates -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror
          cargo fmt --all --check
          git diff --check
