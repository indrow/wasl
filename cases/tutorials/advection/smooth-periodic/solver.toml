format_version = 1

[run]
start_time = 0.0
end_time = 0.1
max_steps = 100000

[parallel]
type = "none"

[output]
directory = "results"

[output.history]
interval_steps = 1000

[output.visualization]
format = "vtk_xml"
interval_steps = 1000

[output.checkpoint]
format = "hdf5"
interval_steps = 1000
keep_last = 1
